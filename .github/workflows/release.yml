name: Release

# Swift Package Manager installs straight from git tags, so a release is: tag X.Y.Z -> GitHub Release.
# Before tagging: set Click2.sdkVersion and move the CHANGELOG entries under the new version.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Check the version matches the tag
        run: |
          grep -q "sdkVersion = \"${GITHUB_REF_NAME}\"" Sources/Click2/Click2.swift || { echo "Click2.sdkVersion is not ${GITHUB_REF_NAME}"; exit 1; }
          grep -q "^## \[${GITHUB_REF_NAME}\]" CHANGELOG.md || { echo "CHANGELOG.md has no ${GITHUB_REF_NAME} section"; exit 1; }
      - run: swift test
      - name: Release notes from the changelog
        run: awk -v v="${GITHUB_REF_NAME}" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^(## )?\[/ {f=0} f' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
